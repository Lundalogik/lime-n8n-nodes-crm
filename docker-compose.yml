services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/typescript-node:26
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules
    command: sleep infinity
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - '5678:5678'
    environment:
      - N8N_LOG_LEVEL=debug
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      - GENERIC_TIMEZONE=Europe/Stockholm
      - N8N_ENCRYPTION_KEY=my-secret-key
    volumes:
      - n8n-data:/home/node/.n8n
      - ./dist:/home/node/.n8n/custom/dist
    restart: unless-stopped

volumes:
  n8n-data:
  node_modules:
