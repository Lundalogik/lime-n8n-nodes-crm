# Releases this n8n community node package: version bump, changelog, tag,
# GitHub release, and npm publish with provenance — all from GitHub Actions.

name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  release:
    name: Version, tag and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version, tag and GitHub release
        run: |
          npx release-it --ci --increment ${{ inputs.bump }} \
            --git.requireBranch main \
            --git.requireCleanWorkingDir \
            --no-git.requireUpstream \
            --git.requireCommits \
            --git.commit \
            --git.tag \
            --git.push \
            --git.changelog="npx auto-changelog --stdout --unreleased --commit-limit false -u --hide-credit" \
            --github.release \
            --hooks.before:init="npm run lint && npm run build" \
            --hooks.after:bump="npx auto-changelog -p" \
            --npm.publish=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npx n8n-node release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
